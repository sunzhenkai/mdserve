<!DOCTYPE html>
<html lang="zh-CN" data-theme="demo">
<head>
  <meta charset="UTF-8">
  <title>独立页示例</title>
  <style>
    html[data-theme="demo"] body {
      margin: 0;
      padding: 2rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    #status { color: #34d399; }
  </style>
</head>
<body>
  <h1 id="standalone">独立交互 HTML</h1>
  <p>此页带 <code>html[data-theme]</code> 与可执行脚本，目录树打开时应走沙箱 iframe。</p>
  <p id="status">脚本未运行</p>
  <script>
    document.getElementById('status').textContent = '脚本已运行'
  </script>
</body>
</html>
