# mdserve 示例配置文件

# 网站配置
site:
  name: "mdserve 文档站"
  default_doc: "README.md"

# 服务配置
server:
  host: "127.0.0.1"
  port: 3000

# Git 自动拉取
git:
  enabled: false
  interval: "5m"
  branch: "main"

# 图表引擎配置（可选）
# Mermaid 始终开箱即用（浏览器端渲染），无需配置。
# 如需支持 d2 / plantuml / graphviz 等更多 DSL，请自托管 Kroki 容器并启用：
#   docker run -d -p 8000:8000 yuzutech/kroki
diagrams:
  kroki:
    enabled: false
    url: "http://localhost:8000"
    timeout: "10s"
    cache_version: 1

# MCP (Model Context Protocol) 配置（可选）
# mdserve 提供两种 MCP 传输，让 AI 客户端（Claude / Cursor / ZCode 等）
# 以只读工具浏览文档库：
#   1. stdio 子命令：mdserve mcp <path>，不受此处开关影响，始终可用。
#   2. HTTP 端点：mdserve serve 时挂载 POST /mcp，受此处 enabled 控制。
# 所有工具均为只读（list_docs / read_doc / search_docs / get_outline / list_tags）。
mcp:
  enabled: true   # 是否在 serve 中挂载 /mcp HTTP 端点（默认 true，只读无副作用）

# 菜单配置
menu:
  - title: "指南"
    children:
      - title: "快速开始"
        type: doc
        path: "docs/guide/getting-started"
      - title: "配置说明"
        type: doc
        path: "docs/guide/configuration"
  - title: "API"
    children:
      - title: "接口文档"
        type: category
        path: "docs/api"
